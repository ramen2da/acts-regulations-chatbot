<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아신대학교 규정 검색 · 비교 챗봇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>아신대학교 규정 검색 · 비교</h1>
      <p class="subtitle">규정집(2026.07.11) 전체 조항을 대상으로 자연어로 검색하고, 규정 간 상호 비교를 물어볼 수 있습니다.</p>
    </header>

    <section class="ask-box">
      <textarea id="question" rows="3" placeholder="예: 교원 정년과 직원 정년 규정을 비교해줘 / 징계 시효는 몇 년이야?"></textarea>
      <button id="askBtn">질문하기</button>
    </section>

    <p id="status" class="status">초기화 중...</p>

    <section class="answer-box">
      <pre id="answer"></pre>
      <p id="sources" class="sources"></p>
    </section>

    <hr />

    <section class="lookup-box">
      <h2>조항 지정 → 다른 규정에서 비슷한 내용 찾기</h2>
      <p class="subtitle">특정 조항을 고르면 다른 규정들 중 내용이 비슷한 조항을 유사도 순으로 찾아줍니다. 정관·상위 규정을 개정할 때 함께 검토할 곳을 확인하는 용도입니다.</p>
      <div class="lookup-controls">
        <select id="regSelect"></select>
        <select id="articleSelect"></select>
        <button id="lookupBtn">유사 조항 찾기</button>
      </div>
      <p id="lookupStatus" class="status"></p>
      <div id="lookupResults" class="lookup-results"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
